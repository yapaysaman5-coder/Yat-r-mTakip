name: Android APK

# Builds an installable APK on GitHub and publishes it as the "android-latest" release,
# so it can be downloaded straight to the phone. Docs-only changes don't trigger a build.
on:
  push:
    branches: ['claude/investment-tracking-app-g0d5xo', 'main']
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'app.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      APK_NAME: YatirimTakip-${{ github.run_number }}.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Save the Gradle distribution and dependency caches on this branch too, so later
          # builds don't depend on Gradle's download servers.
          cache-read-only: false

      - name: Install dependencies
        run: npm ci

      - name: Check (types, lint, tests)
        run: npm run check

      - name: Generate native Android project
        run: |
          npx expo prebuild --platform android --no-install
          props=android/gradle/wrapper/gradle-wrapper.properties
          # A longer download timeout than the 10 s default.
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$props"
          cat "$props"

      - name: Download Gradle (with retries)
        working-directory: android
        run: |
          # Gradle's download servers have returned 504s; wait them out instead of failing.
          for attempt in 1 2 3 4 5 6; do
            if ./gradlew --version; then exit 0; fi
            echo "Gradle download failed (attempt $attempt/6); retrying in $((attempt * 30)) s..."
            sleep $((attempt * 30))
          done
          exit 1

      - name: Build APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/$APK_NAME"
          ls -la out

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: YatirimTakip-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      - name: Publish "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          cat > notes.md <<NOTES
          **Yatırım Takip — Android (derleme #${{ github.run_number }})**

          Telefonda kurmak için:
          1. Aşağıdaki **$APK_NAME** dosyasına dokunup indirin.
          2. İndirilen dosyayı açın. Android "bilinmeyen uygulamalar" izni isterse bu kaynağa izin verin.
          3. **Yükle**'ye dokunun. Yeni sürümler eskisinin üzerine güncelleme olarak kurulur, verileriniz kaybolmaz.

          Kaynak: \`${GITHUB_SHA::7}\` · dal: \`${GITHUB_REF_NAME}\`
          NOTES
          gh release create android-latest "out/$APK_NAME" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Android · son sürüm (#${{ github.run_number }})" \
            --notes-file notes.md
